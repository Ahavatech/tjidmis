# Local OJS 3.3.0-22 for development and testing (not for public hosting):
#   docker compose up -d                 -> OJS at http://localhost:8082  (then run tools/dev_install_ojs.sh once)
# The JIDMIS theme is mounted into OJS; see README.md for importing content and deploying.
services:
  db:
    image: mariadb:10.4
    environment: { MARIADB_ROOT_PASSWORD: root }
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"], interval: 3s, timeout: 3s, retries: 40 }
  ojs:
    image: pkpofficial/ojs:3_3_0-22
    depends_on: { db: { condition: service_healthy } }
    ports: ["8082:80"]
    volumes:
      - ./ojs-theme/jidmis:/var/www/html/plugins/themes/jidmis:ro
      - ojs_files:/var/www/files
      - ojs_public:/var/www/html/public
volumes: { db_data: {}, ojs_files: {}, ojs_public: {} }
