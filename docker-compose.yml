# Local setup (not for public hosting):
#   docker compose up -d                       our app at http://localhost:8081/index.php/jidmis  (then run tools/dev_install.sh once)
#   docker compose --profile reference up -d   also starts the real OJS 3.3.0-22 at http://localhost:8082  (then tools/dev_install_ojs.sh once)
services:
  db:
    image: mariadb:10.4
    environment: { MARIADB_ROOT_PASSWORD: root }
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"], interval: 3s, timeout: 3s, retries: 40 }
  app:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    ports: ["8081:80"]
    volumes:
      - .:/var/www/html
      - journal_files:/var/journal_files
  ojs:
    profiles: ["reference"]
    image: pkpofficial/ojs:3_3_0-22
    depends_on: { db: { condition: service_healthy } }
    ports: ["8082:80"]
    volumes:
      - ./ojs-theme/jidmis:/var/www/html/plugins/themes/jidmis:ro
      - ojs_files:/var/www/files
      - ojs_public:/var/www/html/public
volumes: { db_data: {}, journal_files: {}, ojs_files: {}, ojs_public: {} }
